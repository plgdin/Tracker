<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Alex+Brush&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>NayaKart | Professional Baking Supplies, Tools & Raw Materials</title>
    <!-- Chrome Speculation Rules for instant prerendering and prefetching -->
    <script type="speculationrules">
      {
        "prerender": [
          {
            "source": "list",
            "urls": ["/", "/products"],
            "eagerness": "moderate"
          }
        ],
        "prefetch": [
          {
            "source": "document",
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "*/admin/login*" } },
                { "not": { "href_matches": "*logout*" } },
                { "not": { "href_matches": "*delete*" } }
              ]
            },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
